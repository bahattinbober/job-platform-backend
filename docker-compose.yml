services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: job-platform-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: job_platform
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: job-platform-redis
    restart: always
    ports:
      - '6379:6379'

volumes:
  postgres_data:
